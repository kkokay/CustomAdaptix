# SECURITY NOTES

1. **Never commit keys to git** - Use environment variables or secrets management
2. **Rotate keys periodically** - Change encryption key every campaign
3. **Use HTTPS in production** - Always enable SSL for external listeners
4. **Validate User-Agent** - Reduce detection by validating request patterns
5. **Enable jitter** - Adds randomness to evade detection
6. **Test thoroughly** - Verify agent connectivity before deployment

---

# TROUBLESHOOTING

## Connection Issues
- Check firewall rules
- Verify callback_addresses are correct
- Ensure listener is bound to correct port
- Check logs for encryption errors

## Performance
- If jitter is too high, reduce jitter_max_ms
- If padding is too large, reduce payload_size_max
- Monitor CPU usage with high load

## Compatibility
- RC4 fallback automatically used for legacy agents
- ChaCha20 agents will fail if listener uses RC4
- Always update agents with listener

